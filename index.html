<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Simple</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #101114;
        color: #ecf0f1;
      }

      .game-wrapper {
        text-align: center;
      }

      #scoreboard {
        font-size: 1.1rem;
        margin-bottom: 0.75rem;
      }

      #gameCanvas {
        border: 2px solid #ecf0f1;
        background: #1b1d22;
        display: block;
        margin-inline: auto;
      }

      .help {
        margin-top: 0.75rem;
        color: #b8bec6;
      }
    </style>
  </head>
  <body>
    <main class="game-wrapper">
      <h1>Snake</h1>
      <div id="scoreboard">Puntaje: <strong id="score">0</strong></div>
      <canvas id="gameCanvas" width="400" height="400" aria-label="Juego Snake"></canvas>
      <p class="help">Usa flechas o WASD para moverte. Presiona Enter para reiniciar cuando pierdas.</p>
    </main>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');

      const cellSize = 20;
      const boardSize = canvas.width / cellSize;

      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let gameOver;
      let gameInterval;

      function initializeGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { ...direction };
        score = 0;
        gameOver = false;
        food = placeFood();
        scoreEl.textContent = score;
        render();
      }

      function placeFood() {
        let newFood;
        do {
          newFood = {
            x: Math.floor(Math.random() * boardSize),
            y: Math.floor(Math.random() * boardSize),
          };
        } while (snake.some((segment) => segment.x === newFood.x && segment.y === newFood.y));
        return newFood;
      }

      function update() {
        if (gameOver) {
          return;
        }

        direction = nextDirection;
        const head = snake[0];
        const newHead = { x: head.x + direction.x, y: head.y + direction.y };

        if (newHead.x < 0) newHead.x = boardSize - 1;
        if (newHead.x >= boardSize) newHead.x = 0;
        if (newHead.y < 0) newHead.y = boardSize - 1;
        if (newHead.y >= boardSize) newHead.y = 0;

        const hitSelf = snake.some((segment) => segment.x === newHead.x && segment.y === newHead.y);

        if (hitSelf) {
          gameOver = true;
          render();
          return;
        }

        snake.unshift(newHead);

        if (newHead.x === food.x && newHead.y === food.y) {
          score += 1;
          scoreEl.textContent = score;
          food = placeFood();
        } else {
          snake.pop();
        }

        render();
      }

      function drawFood(x, y) {
        const px = x * cellSize;
        const py = y * cellSize;
        const center = cellSize / 2;

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(px + center, py + center, cellSize * 0.36, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(px + center - 1, py + 2, 2, 5);
      }

      function drawSnakeBody(segment) {
        const px = segment.x * cellSize;
        const py = segment.y * cellSize;
        const center = cellSize / 2;

        ctx.fillStyle = '#2f9e44';
        ctx.beginPath();
        ctx.arc(px + center, py + center, cellSize * 0.43, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#74c69d';
        ctx.beginPath();
        ctx.arc(px + center, py + center, cellSize * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSnakeHead(segment) {
        const px = segment.x * cellSize;
        const py = segment.y * cellSize;
        const center = cellSize / 2;
        const eyeOffset = cellSize * 0.16;
        const eyeRadius = cellSize * 0.08;
        const mouthRadius = cellSize * 0.2;

        ctx.fillStyle = '#38b24d';
        ctx.beginPath();
        ctx.arc(px + center, py + center, cellSize * 0.46, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#74c69d';
        ctx.beginPath();
        ctx.arc(px + center, py + center, cellSize * 0.24, 0, Math.PI * 2);
        ctx.fill();

        let eye1 = { x: px + center - eyeOffset, y: py + center - eyeOffset };
        let eye2 = { x: px + center + eyeOffset, y: py + center - eyeOffset };
        let smileCenter = { x: px + center, y: py + center + eyeOffset };
        let smileStart = 0.15 * Math.PI;
        let smileEnd = 0.85 * Math.PI;

        if (direction.x === -1) {
          eye1 = { x: px + center - eyeOffset, y: py + center - eyeOffset };
          eye2 = { x: px + center - eyeOffset, y: py + center + eyeOffset };
          smileCenter = { x: px + center - eyeOffset * 0.8, y: py + center };
          smileStart = 0.65 * Math.PI;
          smileEnd = 1.35 * Math.PI;
        } else if (direction.x === 1) {
          eye1 = { x: px + center + eyeOffset, y: py + center - eyeOffset };
          eye2 = { x: px + center + eyeOffset, y: py + center + eyeOffset };
          smileCenter = { x: px + center + eyeOffset * 0.8, y: py + center };
          smileStart = -0.35 * Math.PI;
          smileEnd = 0.35 * Math.PI;
        } else if (direction.y === -1) {
          eye1 = { x: px + center - eyeOffset, y: py + center - eyeOffset };
          eye2 = { x: px + center + eyeOffset, y: py + center - eyeOffset };
          smileCenter = { x: px + center, y: py + center - eyeOffset * 0.8 };
          smileStart = 1.15 * Math.PI;
          smileEnd = 1.85 * Math.PI;
        }

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(eye1.x, eye1.y, eyeRadius, 0, Math.PI * 2);
        ctx.arc(eye2.x, eye2.y, eyeRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(eye1.x, eye1.y, eyeRadius * 0.5, 0, Math.PI * 2);
        ctx.arc(eye2.x, eye2.y, eyeRadius * 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#1f5131';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(smileCenter.x, smileCenter.y, mouthRadius, smileStart, smileEnd);
        ctx.stroke();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        snake.forEach((segment, index) => {
          if (index === 0) {
            drawSnakeHead(segment);
          } else {
            drawSnakeBody(segment);
          }
        });

        drawFood(food.x, food.y);

        if (gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.font = 'bold 32px Arial';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '18px Arial';
          ctx.fillText('Presiona Enter para reiniciar', canvas.width / 2, canvas.height / 2 + 24);
        }
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && gameOver) {
          initializeGame();
          return;
        }

        const controls = {
          ArrowUp: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 },
          w: { x: 0, y: -1 },
          s: { x: 0, y: 1 },
          a: { x: -1, y: 0 },
          d: { x: 1, y: 0 },
        };

        const requestedDirection = controls[event.key] || controls[event.key.toLowerCase()];
        if (!requestedDirection) {
          return;
        }

        const isReversing =
          requestedDirection.x === -direction.x && requestedDirection.y === -direction.y;

        if (!isReversing) {
          nextDirection = requestedDirection;
        }
      });

      initializeGame();
      gameInterval = setInterval(update, 120);
    </script>
  </body>
</html>
